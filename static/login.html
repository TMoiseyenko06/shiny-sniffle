<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Sign in · LongCat Video</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=__V__">
</head>
<body>
  <main class="login">
    <form class="card login-card" id="login" novalidate>
      <div class="brand"><img src="/static/icon.svg" alt="" width="30" height="30"> LongCat <span>Video</span></div>
      <h1>Sign in</h1>
      <p class="muted">Private image-to-video studio. Use the password from <code>GUI_PASSWORD</code> in <code>.env</code>.</p>
      <div class="field">
        <label class="lbl" for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus>
      </div>
      <button class="btn primary big" type="submit" id="go">Unlock</button>
      <p class="form-error" id="err" role="alert" hidden></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('login');
    const go = document.getElementById('go');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      err.hidden = true;
      go.disabled = true;
      go.textContent = 'Checking…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (res.ok) { location.replace('/'); return; }
        let message = 'Sign-in failed.';
        try { message = (await res.json()).detail || message; } catch (_) {}
        err.textContent = message;
        err.hidden = false;
      } catch (_) {
        err.textContent = 'Cannot reach the server.';
        err.hidden = false;
      }
      go.disabled = false;
      go.textContent = 'Unlock';
    });
  </script>
</body>
</html>
